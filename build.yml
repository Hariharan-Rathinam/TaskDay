name: Build APK and web app

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Prepare Android project
        run: node scripts/build-android.mjs

      - name: Build signed APK
        working-directory: android
        env:
          TASKDAY_KEYSTORE_PASSWORD: ${{ secrets.TASKDAY_KEYSTORE_PASSWORD }}
          TASKDAY_KEY_PASSWORD: ${{ secrets.TASKDAY_KEY_PASSWORD }}
          TASKDAY_KEY_ALIAS: ${{ secrets.TASKDAY_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Taskday.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Taskday-apk
          path: Taskday.apk

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Taskday.apk

  web:
    # Publishes the web app to GitHub Pages (enable it once: Settings -> Pages -> Source: GitHub Actions).
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
